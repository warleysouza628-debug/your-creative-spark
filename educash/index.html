<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c35"><title>EduCash | Desafio Financeiro</title>
<style>
:root{--navy:#101c35;--blue:#315efb;--bg:#f3f6fb;--ink:#17233b;--muted:#72809a;--green:#13845d;--red:#c53f50;--line:#e3e9f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--navy);color:white;padding:24px 16px}.brand{font-size:23px;font-weight:850;margin:0 8px 5px}.sub{font-size:12px;color:#aab8d4;margin:0 8px 28px}.nav{width:100%;padding:13px 12px;margin:3px 0;text-align:left;border:0;border-radius:10px;background:transparent;color:#dce5f7;font-weight:650}.nav.active,.nav:hover{background:#26395d;color:white}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.top h1{margin:0;font-size:26px}.hint{color:var(--muted);font-size:13px;margin-top:5px}.pill{background:#fff3d6;color:#81530a;border-radius:30px;padding:8px 12px;font-size:12px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #142c5010}.metric{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:25px;font-weight:850;margin-top:9px;letter-spacing:-.5px}.panel{margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:13px}.tag{font-size:11px;font-weight:800;border-radius:20px;padding:5px 8px;background:#e8f7ef;color:var(--green)}.tag.pending{background:#fff0d8;color:#946000}.btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:750}.btn.secondary{background:#eaf0ff;color:#2349ce}.btn.danger{background:#fff0f1;color:var(--red)}button,select,input{font:inherit}select,input{padding:11px;border:1px solid #dbe2ed;border-radius:10px;background:white;max-width:100%}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.hidden{display:none!important}.bigbalance{font-size:34px;font-weight:900}.qr{width:154px;height:154px;margin:15px auto;background:white;border:9px solid white;outline:1px solid #ddd;display:grid;grid-template-columns:repeat(11,1fr);gap:2px}.qr i{background:#111}.qr i:nth-child(3n),.qr i:nth-child(7n){background:white}.note{font-size:12px;color:var(--muted);line-height:1.5}.empty{text-align:center;padding:28px;color:var(--muted)}.ranknum{font-weight:900;font-size:18px;color:var(--blue);width:28px}.foot{font-size:11px;color:var(--muted);text-align:center;padding:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:13px;position:sticky;top:0;z-index:5}.brand{display:inline-block;margin:0 10px 0 0}.sub{display:none}.navs{display:flex;gap:5px;overflow:auto;margin-top:10px}.nav{white-space:nowrap;width:auto;margin:0;padding:9px}.main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.top h1{font-size:22px}}@media(max-width:380px){.value{font-size:21px}.card{padding:13px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">◈ EduCash</div><div class="sub">DESAFIO FINANCEIRO ESCOLAR</div><div class="navs"><button class="nav active" data-page="inicio">▦ Visão geral</button><button class="nav" data-page="contas">▤ Contas e dívidas</button><button class="nav" data-page="pix">▣ Pix fictício</button><button class="nav" data-page="extrato">↗ Extrato</button><button class="nav" data-page="ranking">♜ Ranking</button><button class="nav" data-page="professor">⚙ Professor</button></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Visão geral</h1><div class="hint">Aprenda a administrar o dinheiro da sua turma.</div></div><span class="pill">● AMBIENTE 100% FICTÍCIO</span></header><section id="view"></section><div class="foot">EduCash escolar • Nenhum dinheiro real é movimentado. Pix e QR Code são apenas simulações.</div></main></div>
<script>
const initial=()=>({teams:[{id:1,name:'Turma 1908',balance:1800},{id:2,name:'Turma 1909',balance:1650},{id:3,name:'Turma 2001',balance:2000},{id:4,name:'Turma 2002',balance:1450}],bills:[{id:1,team:1,name:'Conta de água',amount:180,due:'2026-10-25',paid:false},{id:2,team:1,name:'Energia elétrica',amount:260,due:'2026-10-27',paid:false},{id:3,team:1,name:'Internet escolar',amount:120,due:'2026-10-20',paid:false},{id:4,team:2,name:'Conta de água',amount:150,due:'2026-10-25',paid:false},{id:5,team:2,name:'Materiais escolares',amount:220,due:'2026-10-28',paid:false},{id:6,team:3,name:'Energia elétrica',amount:245,due:'2026-10-26',paid:false},{id:7,team:3,name:'Limpeza',amount:135,due:'2026-10-29',paid:false},{id:8,team:4,name:'Internet escolar',amount:110,due:'2026-10-24',paid:false},{id:9,team:4,name:'Conta de água',amount:165,due:'2026-10-27',paid:false}],transactions:[]});
let db;try{db=JSON.parse(localStorage.getItem('educash-data-v2'))||initial()}catch(e){db=initial()}let selected=1,selectedBill=null,page='inicio';
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),team=id=>db.teams.find(t=>t.id===Number(id)),save=()=>localStorage.setItem('educash-data-v2',JSON.stringify(db)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function btn(label,action,cls='btn'){return '<button class="'+cls+'" onclick="'+action+'">'+label+'</button>'}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=({inicio:'Visão geral',contas:'Contas e dívidas',pix:'Pix fictício',extrato:'Extrato',ranking:'Ranking',professor:'Painel do professor'})[p];render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
function stats(){let unpaid=db.bills.filter(b=>!b.paid),paid=db.bills.filter(b=>b.paid);return {balance:db.teams.reduce((s,t)=>s+t.balance,0),debt:unpaid.reduce((s,b)=>s+b.amount,0),paid:paid.length,unpaid:unpaid.length}}
function teamSelect(){return '<select id="teamSelect" onchange="selected=+this.value;render()">'+db.teams.map(t=>'<option value="'+t.id+'" '+(selected===t.id?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>'}
function render(){let v=document.getElementById('view'),s=stats(),t=team(selected);if(!t){selected=db.teams[0]?.id||0;t=team(selected)}
if(page==='inicio'){v.innerHTML='<div class="cards"><div class="card"><div class="metric">SALDO TOTAL DAS TURMAS</div><div class="value">'+money(s.balance)+'</div><div class="hint">Dinheiro fictício disponível</div></div><div class="card"><div class="metric">DÍVIDAS EM ABERTO</div><div class="value">'+money(s.debt)+'</div><div class="hint">'+s.unpaid+' contas pendentes</div></div><div class="card"><div class="metric">CONTAS PAGAS</div><div class="value">'+s.paid+'</div><div class="hint">Nesta rodada</div></div><div class="card"><div class="metric">TURMAS PARTICIPANTES</div><div class="value">'+db.teams.length+'</div><div class="hint">Competindo pelo melhor saldo</div></div></div><div class="grid2"><div class="panel"><h2>Saldo por turma</h2>'+db.teams.map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><div class="muted">'+db.bills.filter(b=>b.team===x.id&&!b.paid).length+' contas em aberto</div></div><b>'+money(x.balance)+'</b></div>').join('')+'</div><div class="panel"><h2>Atividade recente</h2>'+(db.transactions.slice(-5).reverse().map(x=>'<div class="row"><div><b>'+esc(x.label)+'</b><div class="muted">'+esc(x.team)+' • '+esc(x.date)+'</div></div><b>'+money(x.amount)+'</b></div>').join('')||'<div class="empty">Nenhuma movimentação ainda.<br>Comece pagando uma conta fictícia.</div>')+'</div></div><div class="panel"><h2>Acessos rápidos</h2><div class="controls">'+btn('Ver contas','go("contas")')+btn('Fazer Pix fictício','go("pix")','btn secondary')+btn('Ver ranking','go("ranking")','btn secondary')+'</div></div>'}
if(page==='contas'){v.innerHTML='<div class="panel"><div class="controls">'+teamSelect()+'<select id="billFilter" onchange="render()"><option value="all">Todas as contas</option><option value="open">Em aberto</option><option value="paid">Pagas</option></select></div><h2>Contas da turma</h2>'+db.bills.filter(b=>b.team===selected).filter(b=>document.getElementById('billFilter')?.value==='paid'?b.paid:document.getElementById('billFilter')?.value==='open'?!b.paid:true).map(b=>'<div class="row"><div><b>'+esc(b.name)+'</b><div class="muted">Vencimento: '+b.due.split('-').reverse().join('/')+'</div></div><div style="text-align:right"><b>'+money(b.amount)+'</b><div style="margin:5px 0"><span class="tag '+(b.paid?'':'pending')+'">'+(b.paid?'PAGA':'PENDENTE')+'</span></div>'+(!b.paid?btn('Pagar','chooseBill('+b.id+')','btn'):'')+'</div></div>').join('')||'<div class="empty">Nenhuma conta nesta categoria.</div>'}</div>'}
if(page==='pix'){let b=db.bills.find(x=>x.id===selectedBill);v.innerHTML='<div class="grid2"><div class="panel"><h2>Pagamento simulado</h2><p class="muted">Selecione a turma e uma conta pendente para iniciar.</p><div class="controls">'+teamSelect()+'</div><div class="controls"><select id="billPick" onchange="selectedBill=+this.value"><option value="">Escolha uma conta</option>'+db.bills.filter(x=>x.team===selected&&!x.paid).map(x=>'<option value="'+x.id+'" '+(selectedBill===x.id?'selected':'')+'>'+esc(x.name)+' — '+money(x.amount)+'</option>').join('')+'</select></div>'+(b&&!b.paid?'<div class="row"><span>Valor</span><b>'+money(b.amount)+'</b></div><div class="row"><span>Debitado de</span><b>'+esc(t.name)+'</b></div>'+btn('Confirmar pagamento fictício','payBill('+b.id+')'):'<div class="empty">Escolha uma conta pendente para continuar.</div>')+'<p class="note">O pagamento altera apenas o saldo virtual desta simulação.</p></div><div class="panel" style="text-align:center"><h2>QR Code ilustrativo</h2><div class="qr" aria-label="QR Code decorativo">'+Array.from({length:121},(_,i)=>'<i style="opacity:'+([0,1,2,3,4,5,11,22,33,44,55,66,77,88,99,110,120].includes(i)||((i*17+i%7*11)%5<2)?'1':'0')+'"></i>').join('')+'</div><span class="pill">PIX FICTÍCIO • NÃO PAGÁVEL</span><p class="note">Este QR Code não contém dados bancários e não pode receber pagamentos reais.</p></div></div>'}
if(page==='extrato'){v.innerHTML='<div class="panel"><h2>Extrato de movimentações</h2>'+([...db.transactions].reverse().map(x=>'<div class="row"><div><b>'+esc(x.label)+'</b><div class="muted">'+esc(x.team)+' • '+esc(x.date)+'</div></div><b>'+money(x.amount)+'</b></div>').join('')||'<div class="empty">O extrato aparecerá aqui depois da primeira movimentação.</div>')+'<div class="controls">'+btn('Exportar CSV','exportCSV()','btn secondary')+'</div></div>'}
if(page==='ranking'){let scores=db.teams.map(x=>({t:x,score:x.balance+db.bills.filter(b=>b.team===x.id&&b.paid).length*100-db.bills.filter(b=>b.team===x.id&&!b.paid&&b.due<'2026-10-21').length*150})).sort((a,b)=>b.score-a.score);v.innerHTML='<div class="panel"><h2>Classificação das turmas</h2><p class="note">Pontuação = saldo fictício em reais + 100 pontos por conta paga − 150 pontos por conta vencida e não paga.</p>'+scores.map((x,i)=>'<div class="row"><div style="display:flex;align-items:center;gap:12px"><span class="ranknum">#'+(i+1)+'</span><div><b>'+esc(x.t.name)+'</b><div class="muted">Saldo: '+money(x.t.balance)+'</div></div></div><b>'+x.score.toLocaleString('pt-BR')+' pts</b></div>').join('')+'</div>'}
if(page==='professor'){v.innerHTML='<div class="grid2"><div class="panel"><h2>Adicionar saldo fictício</h2><div class="controls">'+teamSelect()+'</div><label class="muted">Valor em reais fictícios</label><p><input id="creditAmount" type="number" min="1" placeholder="Ex.: 250"></p>'+btn('Adicionar crédito','credit()')+'</div><div class="panel"><h2>Cadastrar conta</h2><div class="controls">'+teamSelect()+'</div><p><input id="billName" placeholder="Nome da conta (ex.: Água)"></p><p><input id="billAmount" type="number" min="1" placeholder="Valor fictício (R$)"></p><p><label class="muted">Vencimento</label><br><input id="billDue" type="date" value="2026-10-30"></p>'+btn('Cadastrar conta','addBill()')+'</div></div><div class="panel"><h2>Gerenciar rodada</h2><p class="note">Adicionar turma e reiniciar os dados de demonstração.</p><div class="controls"><input id="newTeam" placeholder="Nome da turma"><input id="newBalance" type="number" placeholder="Saldo inicial"><button class="btn" onclick="addTeam()">Adicionar turma</button>'+btn('Reiniciar jogo','resetGame()','btn danger')+'</div></div>'}
}
function chooseBill(id){selectedBill=id;go('pix')}
function payBill(id){let b=db.bills.find(x=>x.id===id);if(!b||b.paid)return alert('Esta conta já foi paga ou não existe.');let t=team(b.team);if(t.balance<b.amount)return alert('Saldo insuficiente para esta conta.');if(!confirm('Confirmar pagamento FICTÍCIO de '+money(b.amount)+' da turma '+t.name+'? Nenhum dinheiro real será movimentado.'))return;t.balance-=b.amount;b.paid=true;db.transactions.push({label:'Pagamento: '+b.name,team:t.name,amount:-b.amount,date:new Date().toLocaleString('pt-BR')});save();selected=t.id;selectedBill=null;alert('Pagamento fictício confirmado! O saldo e o extrato foram atualizados.');go('extrato')}
function credit(){let n=Number(document.getElementById('creditAmount').value);if(!n||n<1)return alert('Digite um valor maior que zero.');team(selected).balance+=n;db.transactions.push({label:'Crédito fictício adicionado',team:team(selected).name,amount:n,date:new Date().toLocaleString('pt-BR')});save();alert('Crédito fictício adicionado.');render()}
function addBill(){let name=document.getElementById('billName').value.trim(),amount=Number(document.getElementById('billAmount').value),due=document.getElementById('billDue').value;if(!name||amount<=0||!due)return alert('Preencha nome, valor e vencimento.');db.bills.push({id:Math.max(0,...db.bills.map(b=>b.id))+1,team:selected,name,amount,due,paid:false});save();alert('Conta cadastrada!');go('contas')}
function addTeam(){let name=document.getElementById('newTeam').value.trim(),balance=Number(document.getElementById('newBalance').value);if(!name||balance<0)return alert('Informe nome e saldo inicial válido.');let id=Math.max(0,...db.teams.map(t=>t.id))+1;db.teams.push({id,name,balance});selected=id;save();alert('Turma adicionada!');render()}
function resetGame(){if(!confirm('Apagar as alterações locais e restaurar os dados iniciais deste dispositivo?'))return;db=initial();selected=1;selectedBill=null;save();go('inicio')}
function exportCSV(){let rows=[['Turma','Conta','Valor','Vencimento','Status'],...db.bills.map(b=>[team(b.team)?.name,b.name,b.amount,b.due,b.paid?'Paga':'Pendente'])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='educash-extrato.csv';a.click();URL.revokeObjectURL(a.href)}
save();render();
</script></body></html>
